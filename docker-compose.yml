# Production setup with the image from GitHub Container Registry, built by CI
# from main. Put a TLS-terminating proxy (Caddy, Traefik, host nginx) in front
# of port 8080: Discord OAuth and interactions need HTTPS.
#
#   docker compose pull && docker compose up -d
#
# Build from source instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# GENETIC_IMAGE picks another tag, e.g. ghcr.io/oldbear24/genetic-mastery:sha-1a2b3c4.
services:
  app:
    image: ${GENETIC_IMAGE:-ghcr.io/oldbear24/genetic-mastery:latest}
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      TRUSTED_PROXIES: "*"
    ports:
      - "8080:80"
    volumes:
      - storage:/var/www/html/storage
    restart: unless-stopped

  # Runs the Laravel scheduler (Discord outbox, role refresh, backups).
  scheduler:
    image: ${GENETIC_IMAGE:-ghcr.io/oldbear24/genetic-mastery:latest}
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    command: ["su-exec", "www-data", "php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - app
    restart: unless-stopped

volumes:
  storage:
