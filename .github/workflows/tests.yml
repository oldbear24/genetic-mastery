name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genetic
          POSTGRES_PASSWORD: genetic
          POSTGRES_DB: genetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.db == 'pgsql' && 'genetic_test' || ':memory:' }}
      DB_USERNAME: genetic
      DB_PASSWORD: genetic

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, intl, pdo_sqlite, pdo_pgsql, sodium
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/pest
