name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: [sqlite, pgsql, mysql, mariadb]
        include:
          - db: sqlite
            database: ':memory:'
            port: 0
          - db: pgsql
            database: genetic_test
            port: 5432
          - db: mysql
            database: genetic_test
            port: 3306
          # Same major version as WEDOS webhosting.
          - db: mariadb
            database: genetic_test
            port: 3307

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genetic
          POSTGRES_PASSWORD: genetic
          POSTGRES_DB: genetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: genetic_test
          MYSQL_USER: genetic
          MYSQL_PASSWORD: genetic
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: genetic_test
          MARIADB_USER: genetic
          MARIADB_PASSWORD: genetic
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: ${{ matrix.database }}
      DB_USERNAME: genetic
      DB_PASSWORD: genetic

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, intl, pdo_sqlite, pdo_pgsql, pdo_mysql, sodium
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The audit log triggers need this on MySQL with binary logging, the
      # same situation as on many shared hosts (the app copes without them).
      - name: Allow triggers for the test user
        if: matrix.db == 'mysql'
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Code style
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/pest
