name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through pushing the image.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: [sqlite, pgsql, mysql, mariadb]
        include:
          - db: sqlite
            database: ':memory:'
            port: 0
          - db: pgsql
            database: genetic_test
            port: 5432
          - db: mysql
            database: genetic_test
            port: 3306
          # Same major version as WEDOS webhosting.
          - db: mariadb
            database: genetic_test
            port: 3307

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genetic
          POSTGRES_PASSWORD: genetic
          POSTGRES_DB: genetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: genetic_test
          MYSQL_USER: genetic
          MYSQL_PASSWORD: genetic
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: genetic_test
          MARIADB_USER: genetic
          MARIADB_PASSWORD: genetic
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: ${{ matrix.database }}
      DB_USERNAME: genetic
      DB_PASSWORD: genetic

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, intl, pdo_sqlite, pdo_pgsql, pdo_mysql, sodium
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The audit log triggers need this on MySQL with binary logging, the
      # same situation as on many shared hosts (the app copes without them).
      - name: Allow triggers for the test user
        if: matrix.db == 'mysql'
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Code style
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/pest

  # Builds the image only after the whole test matrix passed, smoke-tests it
  # and pushes it to GitHub Container Registry (ghcr.io/<owner>/<repo>).
  docker:
    name: Docker image
    needs: tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: genetic-mastery:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the image like docker-compose.yml does: migrations, seed,
      # nginx + PHP-FPM. The home page needs the database and the Vite build.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:80 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:8080 \
            -e RUN_MIGRATIONS=true \
            genetic-mastery:smoke
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/up; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/up -o /dev/null
          curl -fsS http://localhost:8080/ -o home.html
          grep -q "GENETIC MASTERY" home.html
          echo "Image is up and serves the home page."

      - name: Container logs
        if: failure()
        run: docker logs smoke || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
