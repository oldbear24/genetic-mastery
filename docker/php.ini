; PHP limits sit slightly above the app limits (15 MB per file, 10 files,
; 60 MB per submission) so the application, not PHP, rejects oversized
; uploads with a Czech message. If PHP dropped the 11th file silently, the
; app could not tell the player why.
upload_max_filesize = 20M
post_max_size = 80M
max_file_uploads = 20
memory_limit = 512M
max_execution_time = 60

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = UTC

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

session.cookie_httponly = 1
session.cookie_samesite = Lax
